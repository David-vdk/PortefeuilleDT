name: Koersen bijwerken
"on":
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_prices.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json history.json
          git diff --cached --quiet || git commit -m "Koersen bijgewerkt"
          git push
